name: Our love, Run away, Gotta save it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Like it never left.

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Guess a version
        id: version
        shell: bash
        run: echo "version=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'latest'

      - name: Build!
        shell: bash
        run: |
          mkdir -p dist
          npx --yes esbuild fancyindex.js --minify --legal-comments=none --outfile=dist/fancyindex.js
          npx --yes esbuild style.css --minify --legal-comments=none --outfile=dist/style.css
          node extra.js header.html dist/header.html
          node extra.js footer.html dist/footer.html
          tar -C dist -cvf fit-moaeiou.tar.zst --zstd \
            header.html footer.html style.css fancyindex.js

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: fit-moaeiou.tar.zst
          body: |
            # 📝 Release Note
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: fit-moaeiou.tar.zst
          remote: /var/www/html/
          key: ${{ secrets.CC_LA_KEY }}
